name: Bidzaar watch

on:
  schedule:
    # каждые 15 минут; GitHub иногда задерживает запуск на 5-20 минут — это норма
    - cron: "*/15 * * * *"
    # раз в неделю: держим репозиторий «активным», иначе GitHub через 60 дней
    # тишины сам отключает расписание
    - cron: "7 3 * * 1"
  workflow_dispatch:
    inputs:
      reseed:
        description: "Перезаписать состояние текущим фидом (без отправки сообщений)"
        type: boolean
        default: false

# перекрывающиеся запуски конфликтовали бы при коммите состояния
concurrency:
  group: bidzaar-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить тендеры и отправить уведомления
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RESEED: ${{ inputs.reseed && '1' || '' }}
          PYTHONIOENCODING: utf-8
        run: python bidzaar_watch.py

      - name: Недельный heartbeat
        if: github.event.schedule == '7 3 * * 1'
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > state/heartbeat.txt

      - name: Сохранить состояние
        run: |
          if [ -z "$(git status --porcelain state)" ]; then
            echo "изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "state: обновлены отслеженные тендеры [skip ci]"
          # состояние могло уехать вперёд из соседнего запуска
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
